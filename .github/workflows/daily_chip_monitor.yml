name: 每日分點籌碼監控

on:
  schedule:
    # 每天台北時間 20:00 (UTC 12:00) 自動執行
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-chip-monitor:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run chip monitor and generate report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --config config.github.json --telegram --tg-always --export
          cp reports/latest_report.html "今日分點籌碼分析.html"
          cp reports/latest_report.html "index.html"

      - name: Commit and push updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "今日分點籌碼分析.html" "index.html" reports/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily chip report ($(date +'%Y-%m-%d %H:%M'))"
            git push
          fi
